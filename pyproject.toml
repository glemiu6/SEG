[project]
name = "seg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["certifi>=2025.10.5", "pydantic>=2.6", "pymupdf>=1.24"]

[project.scripts]
seg = "evidence_graph.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
